
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshop Blurb Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f5f3ef;
            color: #292721;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e5e0d8;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
        }

        .eyebrow {
            margin-bottom: 14px;
            color: #8a6545;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-family: Georgia, serif;
            font-size: 36px;
            line-height: 1.2;
        }

        .description {
            margin-bottom: 28px;
            color: #6b6861;
            font-size: 16px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d8d3cb;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #a47c56;
            outline-offset: 2px;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #72513b;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #593c29;
        }

        .result {
            margin-top: 28px;
            padding: 24px;
            border-left: 4px solid #a47c56;
            border-radius: 8px;
            background: #faf7f2;
            overflow-wrap: anywhere;
        }

        .result-label {
            margin-bottom: 12px;
            color: #8a6545;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .blurb {
            margin: 0;
            color: #292721;
            font-family: Georgia, serif;
            font-size: 21px;
            line-height: 1.6;
        }

        .book-title {
            margin-top: 14px;
            color: #777168;
            font-size: 13px;
        }

        .error {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #fff0ee;
            color: #a12622;
        }

        @media (max-width: 520px) {
            .container {
                padding: 26px;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="eyebrow">The Little Bookshop</div>

        <h1>Every book deserves a brilliant blurb.</h1>

        <p class="description">
            Enter a book title and let AI craft a punchy,
            one-line shelf-talker that makes readers curious.
        </p>

        <!-- Submit the title to the Flask route in app.py -->
        <form method="POST" action="/">
            <label for="title">Book title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. The Great Gatsby"
                value="{{ title }}"
                maxlength="200"
                required
            >

            <button type="submit">Generate Blurb</button>
        </form>

        <!-- Display the blurb returned by app.py -->
        {% if blurb %}
        <div class="result" aria-live="polite">
            <div class="result-label">Your Shelf-Talker</div>

            <p class="blurb">{{ blurb }}</p>

            <div class="book-title">
                For: {{ title }}
            </div>
        </div>
        {% endif %}

        <!-- Display an error if app.py provides one -->
        {% if error %}
        <div class="error" role="alert">
            {{ error }}
        </div>
        {% endif %}
    </main>
</body>
</html>
